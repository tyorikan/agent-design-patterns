[project]
name = "cli01-spec-driven-agent"
version = "0.1.0"
description = "CLI-01: Spec-Driven Agent Design Pattern (ADK 2.13 + agents-cli 1.12)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.13.0",
    "google-genai>=2.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
