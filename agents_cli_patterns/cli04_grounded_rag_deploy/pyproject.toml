[project]
name = "cli04-grounded-rag-deploy"
version = "0.1.0"
description = "CLI-04: Pluggable Grounded RAG & Production Deployment Pattern (ADK 2.13 + agents-cli 1.12)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.13.0",
    "google-genai>=2.30.0",
    "fastapi>=0.124.1",
    "uvicorn>=0.34.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
