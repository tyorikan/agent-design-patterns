[project]
name = "cli03-a2a-interoperability"
version = "0.1.0"
description = "CLI-03: A2A Interoperability Pattern (ADK 2.13 + a2a-sdk + agents-cli 1.12)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.13.0",
    "google-genai>=2.30.0",
    "a2a-sdk>=1.2.0",
    "fastapi>=0.124.1",
    "uvicorn>=0.34.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
