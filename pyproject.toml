[project]
name = "agent-design-patterns"
version = "0.2.0"
description = "AI エージェントデザインパターンのハンズオン実装コンテンツ"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.1.0",
    "google-genai>=1.72.0,<2",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-pubsub>=2.23.0",
    "google-cloud-spanner>=3.49.0",
    "pydantic-settings>=2.4.0",
    "google-antigravity>=0.1.0",
    "rich>=13.9.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]
claude = [
    "anthropic[vertex]>=0.43.0",
]

# shared/ だけをパッケージとして認識（patterns/ は除外）
# これがないと setuptools が shared/ と patterns/ を両方検出してエラーになる
[tool.setuptools.packages.find]
include = ["shared*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "error::DeprecationWarning:google.adk",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
