[project]
name = "agent-design-patterns"
version = "0.3.0"
description = "AI エージェントデザインパターンのハンズオン実装コンテンツ（ADK 2.13 / Gemini 3.8 Flash / agents-cli / Production Patterns）"
readme = "README.md"
requires-python = ">=3.12"
# NOTE: google-agents-cli (1.12.x) は protobuf<7 をピン留めするため、
#       protobuf>=7 を要求する google-antigravity と同一 venv には同居させず、
#       CLI ツールとして分離インストールすることを推奨:
#       `uv tool install "google-agents-cli>=1.12.0"`
dependencies = [
    "google-adk>=2.13.0",
    "google-genai>=2.30.0",
    "google-antigravity>=0.1.23",
    "protobuf>=7.35.0,<8.0.0",
    "a2a-sdk>=1.2.0",
    "fastapi>=0.124.1",
    "uvicorn>=0.34.0",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-pubsub>=2.23.0",
    "google-cloud-spanner>=3.49.0",
    "pydantic-settings>=2.4.0",
    "rich>=13.9.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]

# shared/ だけをパッケージとして認識（patterns/ は除外）
# これがないと setuptools が shared/ と patterns/ を両方検出してエラーになる
[tool.setuptools.packages.find]
include = ["shared*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "error::DeprecationWarning:google.adk",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
